name: Publish 12-tracks zip

on:
  push:
    branches:
      - cursor/12-audio-tracks-366a
    paths:
      - .github/workflows/publish-12tracks.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download latest Windows artifact from build workflow
        uses: dawidd6/action-download-artifact@v2
        with:
          workflow: Windows x64 build (12 audio tracks)
          branch: cursor/12-audio-tracks-366a
          name: obs-studio-12tracks-windows-x64
          path: artifacts
          if_no_artifact_found: fail

      - name: List files
        run: ls -lah artifacts

      - name: Create prerelease with asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 12tracks-${{ github.sha }}
          name: OBS Studio 12 Tracks (${{ github.sha }})
          prerelease: true
          files: artifacts/**
